[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Auditable football analytics powered by TheStatsAPI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "joblib>=1.3,<2", "numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
ml = ["lightgbm>=4.3", "optuna>=3.6", "xgboost>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
